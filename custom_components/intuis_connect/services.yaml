# Field names and descriptions are in translations/<language>.json.
# Schedule, zone and room names are free text: they are checked against the
# home's live data when the action runs.

switch_schedule:
  fields:
    schedule_name:
      required: true
      example: "Weekdays"
      selector:
        text:
    home_id:
      selector:
        text:

refresh_schedules:
  fields:
    home_id:
      selector:
        text:

set_schedule_slot:
  fields:
    schedule_name:
      example: "Weekdays"
      selector:
        text:
    start_day:
      required: true
      example: "0"
      selector:
        select:
          translation_key: day
          options: ["0", "1", "2", "3", "4", "5", "6"]
    start_time:
      required: true
      example: "08:00"
      selector:
        time:
    end_day:
      required: true
      example: "0"
      selector:
        select:
          translation_key: day
          options: ["0", "1", "2", "3", "4", "5", "6"]
    end_time:
      required: true
      example: "12:00"
      selector:
        time:
    zone_name:
      required: true
      example: "Comfort"
      selector:
        text:
    home_id:
      selector:
        text:

set_zone_temperature:
  fields:
    schedule_id:
      selector:
        text:
    schedule_name:
      example: "Weekdays"
      selector:
        text:
    zone_name:
      required: true
      example: "Comfort"
      selector:
        text:
    room_name:
      required: true
      example: "Living room"
      selector:
        text:
    temperature:
      required: true
      example: 19.5
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    home_id:
      selector:
        text:

sync_schedule:
  fields:
    schedule_id:
      selector:
        text:
    schedule_name:
      example: "Weekdays"
      selector:
        text:
    timetable:
      required: true
      example: '[{"zone_id": 0, "m_offset": 0}, {"zone_id": 1, "m_offset": 420}]'
      selector:
        text:
          multiline: true
    away_temp:
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    hg_temp:
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
    home_id:
      selector:
        text:

import_energy_history:
  fields:
    days:
      default: 365
      selector:
        number:
          min: 1
          max: 730
          step: 1
          mode: box
    granularity:
      default: hourly
      selector:
        select:
          translation_key: granularity
          options:
            - hourly
            - daily
    clear_existing:
      default: false
      selector:
        boolean:
    room_name:
      example: "Living room"
      selector:
        text:
    home_id:
      selector:
        text:

recalculate_cost_history:
  fields:
    days:
      default: 365
      selector:
        number:
          min: 1
          max: 730
          step: 1
          mode: box
    room_name:
      example: "Living room"
      selector:
        text:
    home_id:
      selector:
        text:
